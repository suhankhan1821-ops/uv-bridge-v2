plugins {
    id("com.android.application")
}

android {
    namespace "com.uvbridge.v2"
    compileSdk 34

    defaultConfig {
        applicationId "com.uvbridge.v2"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("../keystore/uv-bridge-debug.keystore")
            storePassword "android"
            keyAlias "uvbridgedebug"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
